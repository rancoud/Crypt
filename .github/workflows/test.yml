name: test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - '**.md'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
        php-version:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint
        if: matrix.php-version == '8.4'
        run: |
          vendor/bin/php-cs-fixer fix --diff --dry-run

      - name: PHPUnit
        run: |
          vendor/bin/phpunit --colors --display-all-issues --coverage-text --coverage-clover coverage/clover.xml

      - name: Coverage summary
        if: success()
        shell: bash
        run: |
          if [[ ! -f coverage/clover.xml ]]; then
            echo "## Code coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report not found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          metrics=$(grep -m1 -o '<metrics[^>]*/>' coverage/clover.xml)

          total=$(sed -n 's/.*statements="\([0-9]*\)".*/\1/p' <<< "$metrics")
          covered=$(sed -n 's/.*coveredstatements="\([0-9]*\)".*/\1/p' <<< "$metrics")

          {
            echo "## Code coverage"
            echo ""
            if [[ "$total" =~ ^[0-9]+$ ]] && (( total > 0 )) && [[ "$covered" =~ ^[0-9]+$ ]]; then
              percentage=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.2f", c / t * 100 }')
              echo "**Coverage: ${percentage}%** (${covered}/${total} statements covered)"
            else
              echo "Unable to calculate coverage from Clover metrics."
            fi
          } >> "$GITHUB_STEP_SUMMARY"